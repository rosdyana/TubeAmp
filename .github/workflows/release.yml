name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Package (ad-hoc signed, not notarized)
        run: bash tools/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tubeamp-macos
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    name: Windows build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p tubeamp
      - name: Zip
        shell: pwsh
        run: |
          $v = (Select-String -Path crates/app/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/tubeamp.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md -DestinationPath "dist/TubeAmp-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tubeamp-windows
          path: dist/*.zip

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
