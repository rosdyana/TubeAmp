[package]
name = "tubeamp"
version = "0.1.0"
edition = "2021"
publish = false
description = "TubeAmp: YouTube Music player in a classic Winamp skin (M2: interactive main window, bridge, audio tap)"

[[bin]]
name = "tubeamp"
path = "src/main.rs"

[dependencies]
tubeamp-skin = { path = "../skin" }
tubeamp-ui = { path = "../ui" }
tubeamp-audio = { path = "../audio" }
tubeamp-bridge = { path = "../bridge" }
wry = "0.57"
winit = "0.30.13"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
tubeamp-eq = { version = "0.0.0", path = "../eq" }
muda = "0.21"
rfd = "0.18"
raw-window-handle = "0.6"
arboard = "3.7.0"
tubeamp-playlist = { version = "0.0.0", path = "../playlist" }
fastrand = "2"
tubeamp-ytm = { path = "../ytm" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# TODO(windows): Now Playing still goes through SMTC here. Unverified on Windows since the macOS
# Now Playing moved to the page's media session (see `crates/bridge/src/bridge.js`).
souvlaki = "0.9"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"
