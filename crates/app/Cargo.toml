[package]
name = "tubeamp"
version = "0.0.0"
edition = "2021"
publish = false
description = "TubeAmp: YouTube Music player in a classic Winamp skin (M2: interactive main window, bridge, audio tap)"

[[bin]]
name = "tubeamp"
path = "src/main.rs"

[dependencies]
tubeamp-skin = { path = "../skin" }
tubeamp-ui = { path = "../ui" }
tubeamp-audio = { path = "../audio" }
tubeamp-bridge = { path = "../bridge" }
winit = "0.30.13"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
tubeamp-eq = { version = "0.0.0", path = "../eq" }
muda = "0.21"
rfd = "0.18"
raw-window-handle = "0.6"
arboard = "3.7.0"
tubeamp-playlist = { version = "0.0.0", path = "../playlist" }
fastrand = "2"
