[package]
name = "tubeamp-bridge"
version = "0.0.0"
edition = "2021"
publish = false
description = "TubeAmp bridge: wry webview on music.youtube.com, bridge.js injection, Cmd/Evt protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30.13"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[dev-dependencies]
tubeamp-ytm = { path = "../ytm" }
